[package]
name = "vpn233-xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
base64.workspace = true
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
rand_core.workspace = true
rcgen = "0.14"
regex = "1"
reqwest = { workspace = true, features = ["blocking"] }
roxmltree = "0.21.1"
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
tar = "0.4"
tempfile.workspace = true
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio.workspace = true
uuid.workspace = true
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ProcessSnapshotting", "Win32_System_Kernel", "Win32_System_JobObjects", "Win32_System_Threading"] }
