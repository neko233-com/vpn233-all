version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Shanghai
    # main-only repository: audit in CI; do not create version-update branches.
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - rust

  - package-ecosystem: npm
    directory: "/admin-web"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - javascript

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
      - github-actions
