name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  HOMEBREW_NO_ANALYTICS: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"
jobs:
  preflight:
    name: Tag and version preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Cache native Rust verification tool
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/xtask-bootstrap
          key: xtask-${{ runner.os }}-hostlatest-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'xtask/**', 'scripts/xtask.*') }}
      - name: Verify main ancestry and shared version
        run: |
          git merge-base --is-ancestor HEAD origin/main
          bash scripts/xtask.sh version
          test "${GITHUB_REF_NAME}" = "v$(tr -d '\r\n' < version.txt)"
  verify:
    name: Verify (full CI)
    needs: preflight
    uses: ./.github/workflows/ci.yml
  build:
    name: Bundle ${{ matrix.platform }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            reuse: Linux
            exe: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            reuse: Windows
            exe: .exe
          - os: macos-26-intel
            target: x86_64-apple-darwin
            platform: macos-x86_64
            reuse: ""
            exe: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-aarch64
            reuse: ""
            exe: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore verified native Rust tool
        if: matrix.reuse != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: verified-xtask-${{ matrix.reuse }}
          path: target/xtask-bootstrap/debug
      - name: Select reused native Rust tool
        if: matrix.reuse != ''
        shell: bash
        run: |
          chmod +x target/xtask-bootstrap/debug/vpn233-xtask${{ matrix.exe }}
          XTASK_BIN="$PWD/target/xtask-bootstrap/debug/vpn233-xtask${{ matrix.exe }}"
          if [ "$RUNNER_OS" = Windows ]; then XTASK_BIN="$(cygpath -m "$XTASK_BIN")"; fi
          printf 'VPN233_XTASK_BIN=%s\n' "$XTASK_BIN" >> "$GITHUB_ENV"
      - name: Restore verified admin web
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-admin-web
          path: admin-web/dist
      - name: Restore verified native binaries
        if: matrix.reuse != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-binaries-${{ matrix.reuse }}
          path: target/${{ matrix.target }}/release
      - name: Install macOS toolchain and target
        if: matrix.reuse == ''
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup show
          rustup target add "$TARGET"
      - name: Remap source and dependency paths for privacy
        if: matrix.reuse == ''
        shell: bash
        run: |
          XTASK_BIN="$(bash scripts/xtask.sh --path)"
          printf 'VPN233_XTASK_BIN=%s\n' "$XTASK_BIN" >> "$GITHUB_ENV"
          "$XTASK_BIN" build-environment --github
      - if: matrix.reuse == ''
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.platform }}
      - name: Build macOS release binaries
        if: matrix.reuse == ''
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --locked --release --workspace --exclude vpn233-xtask --target "$TARGET"
      - name: Install Bash and portable GNU tools for macOS E2E
        if: matrix.reuse == ''
        shell: bash
        run: |
          brew install bash coreutils
          echo "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Verify macOS architecture, versions and real loopback E2E
        if: matrix.reuse == ''
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY NO_PROXY http_proxy https_proxy all_proxy no_proxy
          export BIN_DIR="$PWD/target/$TARGET/release"
          case "$TARGET" in
            aarch64-apple-darwin) expected_arch=arm64 ;;
            x86_64-apple-darwin) expected_arch=x86_64 ;;
            *) echo 'Unsupported macOS target' >&2; exit 1 ;;
          esac
          for name in vpn233-provider-server vpn233-subscribe-server vpn233-client; do
            test "$(lipo -archs "$BIN_DIR/$name")" = "$expected_arch"
          done
          test "$(uname -m)" = "$expected_arch" || {
            echo 'macOS runtime validation requires the matching native architecture' >&2
            exit 1
          }
          for name in vpn233-provider-server vpn233-subscribe-server vpn233-client; do
            "$BIN_DIR/$name" --version
          done
          bash scripts/e2e/e2e.sh
          printf '### %s runtime validation passed\n\nAll three binary version checks and the real loopback E2E suite passed.\n' "$TARGET" >> "$GITHUB_STEP_SUMMARY"
      - name: Assemble deterministic fast-compressed archives and verify privacy
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          EXE_SUFFIX: ${{ matrix.exe }}
          VERSION: ${{ github.ref_name }}
        run: |
          export VERSION="${VERSION#v}"
          bash .github/scripts/assemble-bundle.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-archives-${{ matrix.platform }}
          path: |
            dist/vpn233-rust-${{ matrix.platform }}.tar.gz
            dist/vpn233-rust-${{ matrix.platform }}.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
  checksums:
    name: Verify all checksums and archive allowlists before publication
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore verified Linux Rust tool
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: verified-xtask-Linux
          path: target/xtask-bootstrap/debug
      - name: Select verified Rust tool
        run: |
          chmod +x target/xtask-bootstrap/debug/vpn233-xtask
          printf 'VPN233_XTASK_BIN=%s\n' "$PWD/target/xtask-bootstrap/debug/vpn233-xtask" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-archives-*
          path: dist
          merge-multiple: true
      - name: Generate and independently verify exact release asset set
        run: |
          (cd dist && sha256sum vpn233-rust-*.tar.gz vpn233-rust-*.zip | LC_ALL=C sort -k2 > SHA256SUMS)
          printf '%s\n' "${GITHUB_REF_NAME#v}" > dist/version.txt
          "$VPN233_XTASK_BIN" verify-release dist "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checked-release-assets
          path: |
            dist/vpn233-rust-*.tar.gz
            dist/vpn233-rust-*.zip
            dist/SHA256SUMS
            dist/version.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
  publish:
    name: Publish verified release
    needs: checksums
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checked-release-assets
          path: dist
      - name: Build release notes
        env:
          VERSION: ${{ github.ref_name }}
        run: bash .github/scripts/release-body.sh > release-body.md
      - name: Publish official assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-body.md
          files: |
            dist/vpn233-rust-*.tar.gz
            dist/vpn233-rust-*.zip
            dist/SHA256SUMS
            dist/version.txt
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
  verify-release:
    name: Verify published downloads
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore verified Linux Rust tool
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: verified-xtask-Linux
          path: target/xtask-bootstrap/debug
      - name: Select verified Rust tool
        run: |
          chmod +x target/xtask-bootstrap/debug/vpn233-xtask
          printf 'VPN233_XTASK_BIN=%s\n' "$PWD/target/xtask-bootstrap/debug/vpn233-xtask" >> "$GITHUB_ENV"
      - name: Download and verify published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --dir assets
          "$VPN233_XTASK_BIN" verify-release assets "${GITHUB_REF_NAME#v}"
  public-install:
    name: Public installation and online update (${{ matrix.platform }})
    needs: verify-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux
            extension: ""
          - os: windows-latest
            platform: Windows
            extension: .exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Restore verified native Rust tool
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: verified-xtask-${{ matrix.platform }}
          path: target/xtask-bootstrap/debug
      - name: Install and update from public release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          XTASK_BIN="$PWD/target/xtask-bootstrap/debug/vpn233-xtask${{ matrix.extension }}"
          chmod +x "$XTASK_BIN"
          "$XTASK_BIN" network public-install --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --mirror off
