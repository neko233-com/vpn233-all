name: Rust Release

on:
  push:
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: npm ci
        working-directory: admin-web
      - run: npm run build
        working-directory: admin-web

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            exe: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            exe: .exe
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macos-x86_64
            exe: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-aarch64
            exe: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: admin-web
      - run: npm run build
        working-directory: admin-web
      - run: cargo build --release --workspace --target ${{ matrix.target }}
      - name: Package release bundle
        shell: bash
        run: |
          set -euo pipefail
          root="bundle/vpn233-rust-${{ matrix.platform }}"
          mkdir -p "$root/bin" "$root/config" "$root/admin-web/dist"
          for name in vpn233-provider-server vpn233-subscribe-server vpn233-client; do
            cp "target/${{ matrix.target }}/release/${name}${{ matrix.exe }}" "$root/bin/"
          done
          cp admin-web/dist/. "$root/admin-web/dist/" -R
          cp provider-server/config.example.yaml "$root/config/provider-server.yaml"
          cp subscribe-server/config.example.yaml "$root/config/subscribe-server.yaml"
          cp vpn233-client/config.example.yaml "$root/config/vpn233-client.yaml"
          cp install.sh install.ps1 update.sh update.ps1 "$root/"
          chmod +x "$root"/*.sh "$root"/bin/*
          cd bundle
          if command -v zip >/dev/null 2>&1; then
            zip -qr "../vpn233-rust-${{ matrix.platform }}.zip" "vpn233-rust-${{ matrix.platform }}"
          else
            tar -czf "../vpn233-rust-${{ matrix.platform }}.tar.gz" "vpn233-rust-${{ matrix.platform }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: vpn233-rust-${{ matrix.platform }}
          path: vpn233-rust-${{ matrix.platform }}.*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
