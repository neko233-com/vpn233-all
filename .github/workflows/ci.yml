name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
jobs:
  rust:
    name: Rust (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: Linux
            extension: ""
            cache: ci-Linux-glibc235
          - os: windows-latest
            platform: Windows
            extension: .exe
            cache: ci-Windows-static-crt
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository Rust toolchain and components
        run: rustup show
      - name: Cache the isolated native verification bootstrap
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/xtask-bootstrap
          key: xtask-${{ runner.os }}-${{ matrix.cache }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'xtask/**', 'scripts/xtask.*') }}
          restore-keys: |
            xtask-${{ runner.os }}-${{ matrix.cache }}-
      - name: Build Rust verification tool once
        shell: bash
        run: |
          XTASK_BIN="$(bash scripts/xtask.sh --path)"
          printf 'VPN233_XTASK_BIN=%s\n' "$XTASK_BIN" >> "$GITHUB_ENV"
      - name: Scan source before creating public build artifacts
        shell: bash
        run: '"$VPN233_XTASK_BIN" privacy'
      - name: Remap source and dependency paths for privacy
        shell: bash
        run: '"$VPN233_XTASK_BIN" build-environment --github'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.cache }}
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --no-fail-fast
      - name: Export synthetic protocol, import and transport fixtures once
        if: runner.os == 'Linux'
        run: cargo run --locked --quiet -p vpn233-core-lib-rust --example mihomo_fixtures -- target/mihomo-fixtures
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux'
        with:
          name: verified-mihomo-fixtures
          path: target/mihomo-fixtures/*.yaml
          if-no-files-found: error
          retention-days: 1
      - name: Build release binaries once
        run: cargo build --locked --release --workspace --exclude vpn233-xtask
      - name: Build and scan the privacy-remapped native verification tool
        shell: bash
        run: |
          cargo build --locked -p vpn233-xtask
          mkdir -p target/verified-xtask
          cp "target/debug/vpn233-xtask${{ matrix.extension }}" target/verified-xtask/
          if [ "$RUNNER_OS" = Linux ]; then strip --strip-debug target/verified-xtask/vpn233-xtask; fi
          "$VPN233_XTASK_BIN" privacy --artifacts target/verified-xtask --artifacts-only
      - name: Reuse the native verification tool in later jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verified-xtask-${{ matrix.platform }}
          path: target/verified-xtask/vpn233-xtask${{ matrix.extension }}
          compression-level: 1
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-binaries-${{ matrix.platform }}
          path: |
            target/release/vpn233-provider-server${{ matrix.extension }}
            target/release/vpn233-subscribe-server${{ matrix.extension }}
            target/release/vpn233-client${{ matrix.extension }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
  web:
    name: Admin web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm ci --prefix admin-web --prefer-offline --no-audit
      - name: Build admin web
        run: npm run build --prefix admin-web
      - name: Validate admin web output
        run: npm run check --prefix admin-web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-admin-web
          path: admin-web/dist/
          if-no-files-found: error
          retention-days: 1
  scripts:
    name: Scripts (${{ matrix.platform }})
    needs: rust
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux
            extension: ""
          - os: windows-latest
            platform: Windows
            extension: .exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore verified native Rust tool
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: verified-xtask-${{ matrix.platform }}
          path: .cache/xtask-bootstrap/debug
      - name: Select the already verified native tool
        shell: bash
        run: |
          chmod +x .cache/xtask-bootstrap/debug/vpn233-xtask${{ matrix.extension }}
          XTASK_BIN="$PWD/.cache/xtask-bootstrap/debug/vpn233-xtask${{ matrix.extension }}"
          if [ "$RUNNER_OS" = Windows ]; then XTASK_BIN="$(cygpath -m "$XTASK_BIN")"; fi
          printf 'VPN233_XTASK_BIN=%s\n' "$XTASK_BIN" >> "$GITHUB_ENV"
      - name: Install PowerShell analyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
      - name: PowerShell parse, lint and installer tests
        shell: pwsh
        run: |
          ./scripts/validate-powershell.ps1
          foreach ($test in @('test-mirrors.ps1', 'test-installers.ps1', 'test-services.ps1')) {
            pwsh -NoProfile -File (Join-Path 'scripts/tests' $test)
            if ($LASTEXITCODE -ne 0) { throw ('PowerShell test failed: ' + $test) }
          }
      - name: Shell syntax, lint and installer tests
        if: runner.os == 'Linux'
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y shellcheck
          fi
          git ls-files -z '*.sh' ':!:legacy/**' | xargs -0 -r shellcheck -S warning
          git ls-files -z '*.sh' ':!:legacy/**' | xargs -0 -r -n1 bash -n
          bash scripts/tests/test-mirrors.sh
          bash scripts/tests/test-installers.sh
          bash scripts/tests/test-services.sh
      # All Rust tool regressions, including privacy/package/cache/HTTP negative
      # cases, run once in the corresponding Rust matrix workspace test job.
  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: actionlint-cache
        with:
          path: ~/go/bin/actionlint
          key: actionlint-${{ runner.os }}-1.7.12
      - name: Install pinned actionlint
        if: steps.actionlint-cache.outputs.cache-hit != 'true'
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Install actionlint and shellcheck
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y shellcheck
          fi
      - name: Validate workflows
        run: |
          actionlint -version
          shellcheck --version
          actionlint -color
  privacy:
    name: Privacy (full history and candidates)
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore verified Linux Rust tool
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: verified-xtask-Linux
          path: .cache/xtask-bootstrap/debug
      - name: Scan full history and candidates with Rust
        run: |
          chmod +x .cache/xtask-bootstrap/debug/vpn233-xtask
          .cache/xtask-bootstrap/debug/vpn233-xtask privacy --history
      - name: Gitleaks full history (redacted)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo \
            --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: audit-cache
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-0.22.2
      - if: steps.audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Rust dependency audit
        run: cargo audit
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm ci --prefix admin-web --prefer-offline --no-audit
      - name: Web dependency audit
        run: npm audit --prefix admin-web --audit-level=high
  docs:
    name: Docs and version contract
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore verified Linux Rust tool
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: verified-xtask-Linux
          path: .cache/xtask-bootstrap/debug
      - name: Verify shared version
        run: |
          chmod +x .cache/xtask-bootstrap/debug/vpn233-xtask
          .cache/xtask-bootstrap/debug/vpn233-xtask version
      - name: Check documentation contract
        run: bash scripts/e2e/check-docs.sh
  e2e:
    name: E2E (${{ matrix.platform }})
    needs: [rust, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux
            bundle: linux-x86_64
            target: x86_64-unknown-linux-gnu
            extension: ""
          - os: windows-latest
            platform: Windows
            bundle: windows-x86_64
            target: x86_64-pc-windows-msvc
            extension: .exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore the verified native Rust tool
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: verified-xtask-${{ matrix.platform }}
          path: .cache/xtask-bootstrap/debug
      - name: Select the already built verification tool
        shell: bash
        run: |
          chmod +x .cache/xtask-bootstrap/debug/vpn233-xtask${{ matrix.extension }}
          XTASK_BIN="$PWD/.cache/xtask-bootstrap/debug/vpn233-xtask${{ matrix.extension }}"
          if [ "$RUNNER_OS" = Windows ]; then XTASK_BIN="$(cygpath -m "$XTASK_BIN")"; fi
          printf 'VPN233_XTASK_BIN=%s\n' "$XTASK_BIN" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-binaries-${{ matrix.platform }}
          path: target/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-admin-web
          path: admin-web/dist
      - name: Linux E2E
        if: runner.os == 'Linux'
        env:
          VPN233_ADMIN_PASSWORD: inherited-value-must-not-be-used
          VPN233_SUBSCRIBE_PORT: "1"
          VPN233_CLIENT_STATS_URL: http://127.0.0.1:1/forbidden
        run: |
          chmod +x target/release/vpn233-*
          bash scripts/e2e/e2e.sh
      - name: Cache checksum-verified official Mihomo archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/tools/mihomo
          key: mihomo-parser-${{ runner.os }}-${{ hashFiles('provider-server/src/config.rs', 'provider-server/src/scripts.rs') }}
      - name: Restore synthetic core fixtures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-mihomo-fixtures
          path: target/mihomo-fixtures
      - name: Validate all generated inbounds with the official Mihomo parser
        shell: bash
        env:
          PROVIDER_BINARY: target/release/vpn233-provider-server${{ matrix.extension }}
        run: '"$VPN233_XTASK_BIN" network mihomo --provider-bin "$PROVIDER_BINARY" --core-fixtures-dir target/mihomo-fixtures --cache-dir .cache/tools/mihomo --download-core'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: runner.os == 'Linux'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - name: Real browser UI, session, mobile and zero-external-request tests
        if: runner.os == 'Linux'
        run: |
          npm ci --prefix admin-web --prefer-offline --no-audit
          npx --prefix admin-web playwright install --with-deps chromium
          npm run test:ui --prefix admin-web
      - name: Windows E2E (PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          VPN233_ADMIN_PASSWORD: inherited-value-must-not-be-used
          VPN233_SUBSCRIBE_PORT: "1"
          VPN233_CLIENT_STATS_URL: http://127.0.0.1:1/forbidden
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/e2e/e2e.ps1
      - name: Package the real platform binaries and verify public archive contents
        shell: bash
        env:
          PLATFORM: ${{ matrix.bundle }}
          TARGET: ${{ matrix.target }}
          EXE_SUFFIX: ${{ matrix.extension }}
          TARGET_DIR: target/release
          BUNDLE_ROOT: target/verify-package/assets
        run: |
          export VERSION
          VERSION="$(tr -d '\r\n' < version.txt)"
          bash .github/scripts/assemble-bundle.sh
